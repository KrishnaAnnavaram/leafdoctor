[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafdoctor"
version = "0.1.0"
description = "Hybrid deep + handcrafted features for plant disease classification"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pillow>=10",
]

[project.optional-dependencies]
cnn = ["torch>=2.1", "torchvision>=0.16"]
xgb = ["xgboost>=2.0"]
mlflow = ["mlflow>=2.9"]
all = ["leafdoctor[cnn,xgb,mlflow]"]
dev = ["pytest>=8"]

[project.scripts]
leafdoctor = "leafdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
